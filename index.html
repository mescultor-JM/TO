<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>AR Sculpture</title>

  <!-- Google Model Viewer -->
  <script
    type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
  </script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family:
        -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;
      -webkit-user-select: none;
      user-select: none;
    }

    model-viewer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background-color: #ffffff;
    }

    /* AR button provided by model-viewer via slot="ar-button".
       It only appears when AR is genuinely available. */
    #ar-button {
      position: absolute;
      bottom: calc(24px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: min(230px, 82vw);
      height: 64px;

      border: 0;
      border-radius: 32px;
      background: linear-gradient(135deg, #007aff 0%, #0055d4 100%);
      color: #ffffff;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      box-shadow: 0 8px 24px rgba(0, 122, 255, 0.30);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    #ar-button:active {
      transform: translateX(-50%) scale(0.97);
    }

    /* Small status line at the bottom. */
    #status {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 6px;
      text-align: center;
      font-size: 11px;
      color: #999;
      pointer-events: none;
      z-index: 5;
    }

    /* Error modal */
    #error-message {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(440px, 90vw);
      padding: 24px;
      background: #ffebee;
      color: #b71c1c;
      border-radius: 16px;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.20);
      z-index: 1000;
    }

    #error-message strong { font-size: 18px; }

    #reload-button {
      margin-top: 10px;
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      background: #c62828;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <model-viewer
    id="sculpture"
    src="./escultura.glb"
    ios-src="./escultura.usdz"
    alt="A 3D model of a sculpture"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-placement="floor"
    ar-scale="auto"
    camera-controls
    shadow-intensity="1"
    exposure="1"
    environment-image="neutral"
    loading="eager"
    reveal="auto">

    <button slot="ar-button" id="ar-button">
      View in AR
    </button>

  </model-viewer>

  <div id="status">Loading sculpture…</div>

  <div id="error-message" role="alert">
    <strong>3D Model Unavailable</strong>
    <br><br>
    <span id="error-text">
      The sculpture could not be loaded.
    </span>
    <br><br>
    <button id="reload-button" type="button">Reload Page</button>
  </div>

  <script>
    /* Minimal JS — only status text + error modal.
       No activateAR(), no canActivateAR, no intent://,
       no watchdog. model-viewer handles AR internally. */

    const viewer       = document.getElementById("sculpture");
    const status       = document.getElementById("status");
    const errorMessage = document.getElementById("error-message");
    const errorText    = document.getElementById("error-text");
    const reloadButton = document.getElementById("reload-button");

    viewer.addEventListener("load", () => {
      status.textContent = "Sculpture loaded.";
    });

    viewer.addEventListener("error", (event) => {
      console.error("[Model Error]", event.detail);
      errorText.textContent =
        "The file escultura.glb could not be loaded. " +
        "Check that it exists at ./escultura.glb (case-sensitive) " +
        "and is served over HTTPS.";
      errorMessage.style.display = "block";
      status.textContent = "Could not load sculpture.";
    });

    viewer.addEventListener("ar-status", (event) => {
      const map = {
        "session-started": "AR session started.",
        "object-placed":   "Sculpture placed in your space.",
        "not-presenting":  "AR session ended.",
        "failed":          "AR could not start on this device."
      };
      status.textContent = map[event.detail.status] || ("AR: " + event.detail.status);
    });

    reloadButton.addEventListener("click", () => {
      window.location.reload();
    });
  </script>

</body>
</html>
