<script>
(() => {
  "use strict";

  const modelViewer = document.getElementById("ar-model");
  const actionButton = document.getElementById("action-button");
  const errorMessage = document.getElementById("error-message");
  const errorText = document.getElementById("error-text");
  const reloadButton = document.getElementById("reload-button");

  const arInfoMessage = document.getElementById("ar-info-message");
  const arInfoTitle = document.getElementById("ar-info-title");
  const arInfoText = document.getElementById("ar-info-text");
  const arInfoFootnote = document.getElementById("ar-info-footnote");
  const closeInfoButton = document.getElementById("close-info-button");
  const copyUrlButton = document.getElementById("copy-url-button");

  const diagnostics = document.getElementById("diagnostics");
  const debugMode =
    new URLSearchParams(window.location.search).get("debug") === "1";

  if (debugMode) diagnostics.style.display = "block";

  const log = (...args) => {
    console.log("[AR Sculpture]", ...args);

    if (debugMode) {
      diagnostics.textContent =
        (diagnostics.textContent + "\n" +
          args.map(value =>
            typeof value === "object"
              ? JSON.stringify(value)
              : String(value)
          ).join(" ")).trim().split("\n").slice(-14).join("\n");
    }
  };

  const ua = navigator.userAgent || "";

  const isAndroid = /Android/i.test(ua);
  const isIOS =
    /iPad|iPhone|iPod/i.test(ua) ||
    (navigator.platform === "MacIntel" &&
      navigator.maxTouchPoints > 1);

  const isInAppBrowser =
    /FBAN|FBAV|FB_IAB|Instagram|Line\/|WhatsApp|MicroMessenger|Twitter|; wv\)/i
      .test(ua);

  const isFirefoxAndroid = isAndroid && /Firefox/i.test(ua);
  const isNonSafariIOS =
    isIOS && /CriOS|FxiOS|EdgiOS|OPiOS/i.test(ua);

  let modelLoaded = false;
  let arAvailable = false;
  let arLaunching = false;
  let loadTimeout = null;
  let launchTimeout = null;

  function clearLaunchTimeout() {
    if (launchTimeout !== null) {
      clearTimeout(launchTimeout);
      launchTimeout = null;
    }
  }

  function hideInfo() {
    arInfoMessage.style.display = "none";
  }

  function showInfo(title, message, footnote) {
    arInfoTitle.textContent = title;
    arInfoText.textContent = message;
    arInfoFootnote.textContent = footnote ||
      "You can still rotate and zoom the sculpture in 3D.";
    arInfoMessage.style.display = "block";
  }

  function showError(message) {
    clearTimeout(loadTimeout);
    errorText.textContent = message;
    errorMessage.style.display = "block";
    actionButton.style.display = "none";
  }

  function setButton(label, icon, className = "") {
    actionButton.className = "action-button " + className;
    actionButton.innerHTML = icon + "<span>" + label + "</span>";
  }

  const arIcon = `
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10
      10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93
      0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93z"/>
    </svg>`;

  const modelIcon = `
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 2 3 7v10l9 5 9-5V7l-9-5zm0 2.3L18.5 8
      12 11.7 5.5 8 12 4.3zM5 9.7l6 3.4V20l-6-3.3V9.7zm8 10.3v-6.9
      l6-3.4v7L13 20z"/>
    </svg>`;

  function refreshButton() {
    if (!modelLoaded) {
      setButton("Loading 3D...", modelIcon, "model-only");
      return;
    }

    // Use model-viewer's own AR capability check after model load.
    arAvailable = modelViewer.canActivateAR === true;

    if (arAvailable) {
      setButton("View in AR", arIcon, "ar-available");
      actionButton.setAttribute("aria-label", "View sculpture in AR");
    } else {
      setButton("View 3D Model", modelIcon, "model-only");
      actionButton.setAttribute("aria-label", "View sculpture in 3D");
    }

    log("AR capability:", arAvailable);
  }

  function resetButton() {
    clearLaunchTimeout();
    arLaunching = false;
    refreshButton();
  }

  // Wait for the model-viewer custom element to be defined.
  customElements.whenDefined("model-viewer").then(() => {
    log("model-viewer component ready");

    if (modelViewer.loaded) {
      modelLoaded = true;
      refreshButton();
    }
  });

  // Detect a successful model load.
  modelViewer.addEventListener("load", () => {
    clearTimeout(loadTimeout);
    modelLoaded = true;
    log("3D model loaded successfully");
    refreshButton();

    // Recheck after AR support has had time to initialize.
    setTimeout(refreshButton, 500);
    setTimeout(refreshButton, 1500);
  });

  // Detect model loading errors.
  modelViewer.addEventListener("error", event => {
    log("Model loading error:", event.detail);

    showError(
      "Could not load escultura.glb. Check that the file exists, " +
      "the filename uses the correct capitalization, and the hosting " +
      "server allows the file to be accessed."
    );
  });

  loadTimeout = setTimeout(() => {
    if (!modelLoaded) {
      showError(
        "The 3D model did not load in time. Check your internet " +
        "connection and verify that ./escultura.glb is accessible."
      );
    }
  }, 20000);

  // AR session status events.
  modelViewer.addEventListener("ar-status", event => {
    const status = event.detail?.status;
    log("AR status:", status);

    if (status === "session-started" || status === "object-placed") {
      clearLaunchTimeout();
      arLaunching = false;
    }

    if (status === "failed") {
      resetButton();
      showInfo(
        "Could Not Start AR",
        "The AR session failed. Check device compatibility and AR support. " +
        "On Android, update Google Play Services for AR. On iPhone, " +
        "verify that the USDZ file is accessible.",
        "You can still view and rotate the sculpture in 3D."
      );
    }

    if (status === "not-presenting") {
      resetButton();
    }
  });

  actionButton.addEventListener("click", async () => {
    if (!modelLoaded || arLaunching) return;

    // Refresh the capability check before attempting AR.
    arAvailable = modelViewer.canActivateAR === true;

    if (!arAvailable) {
      let message =
        "This device or browser cannot currently launch AR. " +
        "You can still use the 3D viewer.";

      if (!window.isSecureContext) {
        message =
          "AR requires HTTPS. Open this page from a secure HTTPS website.";
      } else if (isInAppBrowser) {
        message =
          "AR may be blocked in this in-app browser. Open the page in " +
          "Chrome on Android or Safari on iPhone.";
      } else if (isFirefoxAndroid) {
        message =
          "Try opening this page in Chrome on Android for AR support.";
      } else if (isNonSafariIOS) {
        message =
          "Try opening this page in Safari on your iPhone or iPad.";
      }

      showInfo(
        "AR Not Available",
        message,
        "The 3D sculpture remains available on this page."
      );
      return;
    }

    arLaunching = true;
    setButton("Starting AR...", arIcon, "loading");

    // This is deliberately longer than five seconds because the
    // operating system may take time to open its AR viewer.
    launchTimeout = setTimeout(() => {
      if (arLaunching) {
        log("AR launch timeout");
        resetButton();

        showInfo(
          "AR Did Not Start",
          "The AR viewer did not open. Check device compatibility, " +
          "browser permissions, and whether the AR application is installed.",
          "You can continue viewing the sculpture in 3D."
        );
      }
    }, 15000);

    try {
      // Call directly from the user's click so browser gesture
      // requirements for AR activation are preserved.
      await modelViewer.activateAR();

      // Some AR modes return without leaving this page.
      // The ar-status event also handles session transitions.
      if (arLaunching) {
        clearLaunchTimeout();
        arLaunching = false;
        refreshButton();
      }
    } catch (error) {
      log("activateAR failed:", error?.message || error);
      resetButton();

      showInfo(
        "Could Not Start AR",
        "The browser could not start AR. Use a supported browser, " +
        "check that the model files are accessible, and update your " +
        "device's AR services if applicable.",
        "You can still rotate and zoom the sculpture in 3D."
      );
    }
  });

  closeInfoButton.addEventListener("click", hideInfo);

  copyUrlButton.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(window.location.href);
      copyUrlButton.textContent = "Copied!";
    } catch {
      showInfo(
        "Copy Link",
        "Copy the current page address from your browser's address bar.",
        "You can then paste the link into Chrome or Safari."
      );
      return;
    }

    setTimeout(() => {
      copyUrlButton.textContent = "Copy Link";
    }, 1500);
  });

  reloadButton.addEventListener("click", () => {
    window.location.reload();
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape") hideInfo();
  });

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && modelLoaded && !arLaunching) {
      refreshButton();
    }
  });

  window.addEventListener("orientationchange", () => {
    setTimeout(refreshButton, 700);
  });

  // Initial state.
  setButton("Loading 3D...", modelIcon, "model-only");
  log("Initialized", {
    secureContext: window.isSecureContext,
    android: isAndroid,
    ios: isIOS,
    debugMode
  });
})();
</script>
